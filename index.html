  <style>
    /* Loading screen: inline so it shows before the rest of the site arrives. Appears only if loading takes more than 0.4 s */
    #loader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #fff; opacity: 0; animation: loader-in .3s .4s forwards; transition: visibility .4s; }
    #loader.done { animation: none; opacity: 0; visibility: hidden; transition: opacity .4s, visibility .4s; }
    @keyframes loader-in { to { opacity: 1; } }
    .tetris { position: relative; width: 48px; height: 48px; }
    .tetris i { position: absolute; width: 12px; height: 12px; background: #000; border-radius: 2px; opacity: 0; }
    .tetris .t1 { left: 0;    top: 24px; box-shadow: 12px 0 #000, 0 12px #000, 12px 12px #000; animation: drop1 2.6s infinite; }
    .tetris .t2 { left: 36px; top: 12px; box-shadow: 0 12px #000, 0 24px #000, -12px 24px #000; animation: drop2 2.6s infinite; }
    .tetris .t3 { left: 0;    top: 12px; box-shadow: 12px 0 #000, 24px 0 #000, 24px 12px #000; animation: drop3 2.6s infinite; }
    @keyframes drop1 { 0% { opacity: 0; transform: translateY(-48px); } 8% { opacity: 1; } 18%, 82% { opacity: 1; transform: none; } 94%, 100% { opacity: 0; transform: none; } }
    @keyframes drop2 { 0%, 18% { opacity: 0; transform: translateY(-48px); } 26% { opacity: 1; } 36%, 82% { opacity: 1; transform: none; } 94%, 100% { opacity: 0; transform: none; } }
    @keyframes drop3 { 0%, 36% { opacity: 0; transform: translateY(-48px); } 44% { opacity: 1; } 54%, 82% { opacity: 1; transform: none; } 94%, 100% { opacity: 0; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .tetris i { animation: none; opacity: 1; } }
  </style>
</head>
